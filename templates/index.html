<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AeroRoute AI - Urban Route Planner</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head><body>
<div id="side">
  <h1>🚀 AeroRoute AI</h1>
  <input id="start" placeholder="Start (e.g. Times Square)">
  <input id="end" placeholder="Destination (e.g. Central Park)">
  <select id="priority">
    <option value="balanced">⚖️ Balanced</option><option value="fastest">⚡ Fastest</option>
    <option value="safest">🛡️ Safest</option><option value="emergency">🚨 Emergency</option>
    <option value="accessible">♿ Accessible</option><option value="avoid_crowd">👥 Avoid traffic</option>
    <option value="scenic">🌲 Scenic</option><option value="budget">🍃 Eco / Budget</option>
  </select>
  <button id="go">Plan Route</button>
  <div class="row"><button class="alt" id="save">💾 Save</button><button class="alt" id="block">🚧 Add closure</button></div>
  <div id="msg"></div>
  <div id="result"></div>
  <h3>Nearby services</h3>
  <div class="row"><button class="alt" data-cat="hospital">🏥</button><button class="alt" data-cat="fuel">⛽</button>
  <button class="alt" data-cat="fire">🚒</button><button class="alt" data-cat="parking">🅿️</button>
  <button class="alt" data-cat="restaurant">🍽️</button></div>
  <div id="nearby"></div>
  <h3>Saved routes</h3><div id="saved"></div>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body></html>
